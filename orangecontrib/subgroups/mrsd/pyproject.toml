[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mrsd"
version = "2.0.0"
description = "MRSD - Multiple Responses Subgroup Discovery: algorithms for discovering subgroups in data with several response variables"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7", "threadpoolctl"]
excel = ["openpyxl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
